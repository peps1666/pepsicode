name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional: the stdio MCP transport uses Windows-only
        # process creation flags that a Linux-only matrix cannot regress-test.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check pepsicode/ tests/
          ruff format --check pepsicode/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run offline task evaluation smoke
        run: python -m pepsicode.evals --mode smoke --output .evals/ci-smoke

      - name: Check versions and entry documentation
        run: python scripts/check_project.py

  client:
    name: Desktop checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pepsicode-client/package-lock.json
      - name: Install backend test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install locked desktop dependencies
        working-directory: pepsicode-client
        run: npm ci
      - name: Test desktop behavior
        working-directory: pepsicode-client
        shell: pwsh
        run: |
          npm test *> client-tests.log
          $result = $LASTEXITCODE
          Get-Content client-tests.log
          exit $result
      - name: Check TypeScript
        if: ${{ !cancelled() }}
        working-directory: pepsicode-client
        shell: pwsh
        run: |
          npm run typecheck *> client-types.log
          $result = $LASTEXITCODE
          Get-Content client-types.log
          exit $result
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: desktop-checks-${{ matrix.os }}
          path: |
            pepsicode-client/client-tests.log
            pepsicode-client/client-types.log
          retention-days: 7
          if-no-files-found: ignore
